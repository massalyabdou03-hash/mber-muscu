<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161F">
<meta name="description" content="Mbër Muscu : prise de masse avec des repas sénégalais au budget, séances guidées, liste de courses et suivi du poids.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Mbër Muscu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Concept : app de salle haut de gamme, noir et or — l'or du badge de champion de lutte (mbër).
   Colonne unique, en-tête collant avec logo, carte « tableau de bord » sombre en tête, barre d'onglets flottante. */
:root{
  --bg:#F1F2F6; --surface:#FFFFFF; --surface-2:#EBEDF2; --ink:#10131A; --muted:#5E6577; --line:#E2E5EC;
  --accent:#A87108; --gold:#F2B63C; --btn:#10131A; --on-btn:#FFFFFF;
  --hero:#12161F; --hero-2:#1D2331; --on-hero:#F4F5F8; --hero-muted:rgba(244,245,248,.62); --track:rgba(255,255,255,.12);
  --prot:#22A866; --carb:#3D7FF0; --fat:#9B5BF0; --warn:#C9372C; --ok:#1E9A5A;
  --shadow:0 1px 2px rgba(16,19,26,.05),0 6px 20px rgba(16,19,26,.06);
  --glass:rgba(241,242,246,.82);
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D12; --surface:#151922; --surface-2:#1E232E; --ink:#EEF0F5; --muted:#9AA1B4; --line:#252B37;
  --accent:#F2B63C; --btn:#F2B63C; --on-btn:#12100A;
  --hero:#171C27; --hero-2:#222A3A; --on-hero:#F4F5F8; --hero-muted:rgba(244,245,248,.6); --track:rgba(255,255,255,.1);
  --prot:#43D18A; --carb:#6FA3FF; --fat:#BE93FF; --warn:#FF7B6E; --ok:#43D18A;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --glass:rgba(11,13,18,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D12; --surface:#151922; --surface-2:#1E232E; --ink:#EEF0F5; --muted:#9AA1B4; --line:#252B37;
  --accent:#F2B63C; --btn:#F2B63C; --on-btn:#12100A;
  --hero:#171C27; --hero-2:#222A3A; --on-hero:#F4F5F8; --hero-muted:rgba(244,245,248,.6); --track:rgba(255,255,255,.1);
  --prot:#43D18A; --carb:#6FA3FF; --fat:#BE93FF; --warn:#FF7B6E; --ok:#43D18A;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --glass:rgba(11,13,18,.8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--glass)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.d{font-family:var(--display);font-stretch:112%;font-weight:800;letter-spacing:-.01em}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.logo{flex:none;display:block;border-radius:12px;box-shadow:0 4px 14px rgba(217,142,18,.3)}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wordmark{font:800 19px/1 var(--display);font-stretch:118%;letter-spacing:.01em;text-transform:uppercase}
.wordmark span{color:var(--accent)}
.brand small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px}
.wk svg{width:30px;height:30px;display:block}
.wk .rt-t{stroke:var(--surface-2)}
.wk .rt-v{stroke:var(--accent)}
.wk b{font:800 15px/1 var(--display);font-stretch:110%;font-variant-numeric:tabular-nums}
.wk em{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.wrap{max-width:560px;margin:0 auto;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font:800 50px/.95 var(--display);font-stretch:108%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 2px 0}
.sec h2{font:800 20px/1.1 var(--display);font-stretch:110%;letter-spacing:-.01em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card h2,.big{font:800 24px/1.05 var(--display);font-stretch:110%;letter-spacing:-.015em;text-wrap:balance}

/* Carte tableau de bord */
.hero{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--hero-2),var(--hero) 60%);color:var(--on-hero);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px rgba(10,12,18,.22)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(242,182,60,.22),transparent 70%);pointer-events:none}
.hero .eyebrow{color:var(--hero-muted)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kc{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:4px}
.kc .num{font-size:52px}
.kc .of{font:600 15px/1 var(--body);color:var(--hero-muted)}
.left{margin-top:6px;font-size:13px;color:var(--hero-muted)}
.left b{color:var(--gold);font-weight:700}
.ring{flex:none;position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .rt-t{stroke:var(--track)}
.ring .rt-v{stroke:var(--gold)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:800 20px/1 var(--display);font-stretch:108%;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.mc{display:flex;flex-direction:column;gap:6px;min-width:0}
.mc .ml{font-size:12px;color:var(--hero-muted);display:flex;align-items:center;gap:6px}
.mc .ml i{width:8px;height:8px;border-radius:50%;flex:none}
.mc b{font:700 17px/1 var(--display);font-stretch:105%;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc b small{font:500 12px var(--body);color:var(--hero-muted)}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.mc.p i,.bar.p i{background:var(--prot)}.mc.c i,.bar.c i{background:var(--carb)}.mc.f i,.bar.f i{background:var(--fat)}
.hero .foot{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--hero-muted);border-top:1px solid var(--track);padding-top:12px}
.hero .foot b{color:var(--on-hero);font-variant-numeric:tabular-nums}

.btn{background:var(--btn);color:var(--on-btn);border:0;border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.wide{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;text-align:left}

.banner{border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.banner .bt{flex:1 1 180px;display:flex;flex-direction:column;gap:3px;min-width:0}
.banner .bt b{font:800 17px/1.15 var(--display);font-stretch:108%}
.banner .bt p{font-size:13px;color:var(--muted)}
.banner .btn{flex:1 1 100%}

.sess{display:flex;gap:14px;align-items:center}
.sess-ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.sess-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sess-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.done{background:var(--ok);color:var(--surface)}

.eatrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.eatrow:first-of-type{border-top:0;padding-top:4px}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.eatrow.on .box,.srow.on .box{background:var(--ok);border-color:var(--ok)}
.eatrow.on .box::after,.srow.on .box::after{content:"";width:10px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.eatrow.on .et small{text-decoration:line-through}
.et{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.et b{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.et small{color:var(--ink);font-size:15px;font-weight:500;line-height:1.3}
.ek{text-align:right;font:700 15px/1.2 var(--display);font-stretch:105%;font-variant-numeric:tabular-nums;white-space:nowrap}
.ek small{display:block;color:var(--muted);font:500 12px var(--body)}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:62px;transition:background .15s}
.dy small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dy span{font:800 18px/1 var(--display);font-stretch:105%;font-variant-numeric:tabular-nums}
.dy.td{border-color:var(--accent)}
.dy.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.dy.on small{color:inherit;opacity:.7}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5}
.dot.done{background:var(--ok);opacity:1}
.dy.on .dot{background:var(--on-btn);opacity:.8}
.dy:not(:has(.dot)) span{margin-bottom:9px}

.meal{gap:12px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh .eyebrow{color:var(--accent)}
.mh b{font:800 18px/1 var(--display);font-stretch:105%;font-variant-numeric:tabular-nums;white-space:nowrap}
.mn{font:800 19px/1.15 var(--display);font-stretch:104%;letter-spacing:-.01em;text-wrap:balance}
.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface-2);border-radius:12px;padding:4px 12px}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ings li:first-child{border-top:0}
.ings li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.mf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mf b{color:var(--ink);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;font-weight:600;border-radius:99px;padding:6px 12px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--ok);color:var(--ok)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:11px;padding:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gh h3{font:800 18px/1.1 var(--display);font-stretch:108%}
.gh b{font-variant-numeric:tabular-nums}
.shop{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0}
.srow:first-child{border-top:0}
.srow.on .sn2{text-decoration:line-through;color:var(--muted)}
.sn2{flex:1;min-width:0;font-weight:500}
.sn2 small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.sp{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
textarea.cp{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;font-size:14px}

details.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
details.ex>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:62px}
details.ex>summary::-webkit-details-marker{display:none}
details.ex>summary div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
details.ex>summary b{font-size:16px;line-height:1.25}
.spec{font:800 17px/1 var(--display);font-stretch:108%;color:var(--accent);white-space:nowrap;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.exb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.tip{font-size:14px}
.fig{display:block;width:100%;max-width:340px;height:auto;align-self:center;background:var(--surface-2);border-radius:14px}
.fig .fl{stroke:var(--line);stroke-width:2}
.fig .eq{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.fig .bd{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:var(--surface-2);stroke:var(--ink);stroke-width:3}
.fig .pl{fill:none;stroke:var(--accent);stroke-width:2.6}
.fig .dbm{fill:var(--accent)}
.hint{font-size:13px;font-weight:600;color:var(--accent);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.shead,.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.shead.nokg,.set.nokg{grid-template-columns:30px 1fr 48px}
.shead{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sn{font:800 18px/1 var(--display);color:var(--muted);text-align:center}
.set input,.f input,.f select,.winp input{width:100%;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:8px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.f select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.chk{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:800;font-size:17px}
.set.ok .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.set.ok input{border-color:var(--ok)}
.meta{font-size:12px;color:var(--muted)}

.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:13px;font-weight:600}
.f .h{font-size:12px;color:var(--muted)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .f.full{grid-column:1/-1}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tg div{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:12px;padding:10px 8px;min-width:0}
.tg b{font:800 20px/1 var(--display);font-stretch:105%;font-variant-numeric:tabular-nums;white-space:nowrap}
.tg span{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.winp{display:flex;gap:8px}
.winp .btn{flex:none}
.spark{width:100%;height:72px;display:block}
.spark path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark .ar{fill:var(--accent);opacity:.12;stroke:none}
.spark circle{fill:var(--accent)}
.spark line{stroke:var(--line);stroke-width:1}
.wrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wrow .num{font-size:40px}
.about{display:flex;align-items:center;gap:12px;padding:6px 2px}
.about div{display:flex;flex-direction:column;gap:2px;min-width:0}

/* Barre d'onglets flottante */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs div{pointer-events:auto;display:flex;max-width:520px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(10,12,18,.18)}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:700;min-height:52px;border-radius:16px;transition:background .15s,color .15s}
.tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);background:var(--surface-2)}
.tabs button.on svg{color:var(--accent)}
.rest{position:fixed;z-index:30;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;
  background:var(--hero);color:var(--on-hero);border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(10,12,18,.3)}
.rest .rt{font:800 30px/1 var(--display);font-stretch:108%;color:var(--gold);font-variant-numeric:tabular-nums;min-width:66px}
.rest span:nth-child(2){flex:1;font-weight:600}
.rest button{background:transparent;border:1px solid var(--track);color:inherit;border-radius:10px;padding:8px 10px;font-weight:700;min-height:40px}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--hero);color:var(--on-hero);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 26px rgba(10,12,18,.3)}
@media (prefers-reduced-motion:no-preference){
  .bar i{transition:width .4s ease}
  .ring .rt-v,.wk .rt-v{transition:stroke-dashoffset .5s ease}
  .wrap.anim>*{animation:rise .35s ease both}

<script>
// <core>
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const wd=d=>(d.getDay()+6)%7;
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-wd(x));return x;};
const dateOfWeekday=(i,ref)=>{const m=mondayOf(ref||new Date());m.setDate(m.getDate()+i);return m;};
const dateLabel=d=>DAYS[wd(d)]+' '+d.getDate()+' '+MOIS[d.getMonth()];
const fr=(n,dec)=>{const a=Number(n).toFixed(dec||0).replace('.',',').split(',');return a[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(a[1]?','+a[1]:'');};
const money=n=>fr(Math.round(n/25)*25)+' FCFA';
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);

/* Aliments : valeurs pour 100 g sous la forme mangée (cuit, prêt à manger).

const F=(n,k,p,c,f,raw,L,A,o)=>Object.assign({n,k,p,c,f,raw,price:{local:L,auchan:A}},o||{});
const CATS=['Féculents','Légumineuses','Viandes, poissons, œufs','Produits laitiers','Fruits & légumes','Épicerie'];
const FOODS={
 riz:F('Riz cuit',130,2.7,28,.3,.34,475,650,{b:'Riz',cat:CATS[0]}),
 pates:F('Pâtes cuites',158,5.8,31,.9,.43,800,900,{b:'Pâtes',cat:CATS[0]}),
 pain:F('Pain (baguette)',270,9,55,1.5,1,700,1400,{b:'Pain',cat:CATS[0]}),
 mil:F('Couscous de mil cuit',119,3.5,23.7,1,.4,900,1500,{b:'Couscous de mil (thiéré)',cat:CATS[0]}),
 patate:F('Patate douce cuite',90,2,21,.2,1.15,600,1000,{b:'Patate douce',cat:CATS[0]}),
 avoine:F('Flocons d’avoine',389,17,66,7,1,null,3200,{b:'Flocons d’avoine',cat:CATS[0]}),
 niebe:F('Niébé cuit',116,7.7,20.8,.5,.43,900,1500,{b:'Niébé sec',cat:CATS[1]}),
 lentille:F('Lentilles cuites',116,9,20,.4,.4,1300,1700,{b:'Lentilles sèches',cat:CATS[1]}),
 oeuf:F('Œuf',143,12.6,.7,9.5,1,1636,1818,{b:'Œufs',cat:CATS[2],unit:{n:'œuf',pl:'œufs',g:55}}),
 poulet:F('Poulet cuit',209,26,0,11,1.4,3200,3600,{b:'Poulet (cuisses ou entier)',cat:CATS[2]}),
 boeuf:F('Bœuf ou mouton cuit',250,26,0,17,1.35,4500,6000,{b:'Bœuf ou mouton',cat:CATS[2]}),
 poisson:F('Poisson cuit (thiof, dorade)',120,22,0,3,1.6,4000,6500,{b:'Poisson frais',cat:CATS[2]}),
 sardine:F('Sardines en boîte',208,25,0,11,1.1,4000,4500,{b:'Sardines en boîte',cat:CATS[2]}),
 thon:F('Thon en boîte',116,26,0,1,1.1,8000,7500,{b:'Thon en boîte',cat:CATS[2]}),
 arachide:F('Arachides grillées',567,26,16,49,1,1500,2800,{b:'Arachides',cat:CATS[5]}),
 pate:F('Pâte d’arachide',588,25,20,50,1,2800,5500,{b:'Pâte d’arachide ou beurre de cacahuète',cat:CATS[5]}),
 lait:F('Lait frais (UHT)',61,3.2,4.8,3.3,1,900,1000,{b:'Lait UHT',cat:CATS[3],liquid:true}),
 laitpoudre:F('Lait en poudre',496,26,38,27,1,4800,6800,{b:'Lait en poudre',cat:CATS[3]}),
 caille:F('Lait caillé ou yaourt nature',61,3.5,4.7,3.3,1,1300,1800,{b:'Lait caillé ou yaourt nature',cat:CATS[3]}),
 grec:F('Yaourt grec',97,9,4,5,1,null,4500,{b:'Yaourt grec',cat:CATS[3]}),
 banane:F('Banane',89,1.1,23,.3,1.4,700,1100,{b:'Bananes',cat:CATS[4]}),
 legumes:F('Légumes (oignon, tomate, carotte)',35,1.5,8,.2,1.15,600,1200,{b:'Légumes (oignon, tomate, carotte)',cat:CATS[4]}),
 huile:F('Huile',884,0,0,100,1,1750,2300,{b:'Huile',cat:CATS[5],liquid:true}),
 sucre:F('Sucre',387,0,100,0,1,700,900,{b:'Sucre',cat:CATS[5]})
};
const M=(id,slot,n,items)=>({id,slot,n,items});
const MEALS=[
 M('b1','b','Bouillie d’avoine, lait et banane',[['avoine',80],['lait',250],['banane',120],['pate',20]]),
 M('b2','b','Omelette 3 œufs, pain et oignons',[['oeuf',165],['pain',100],['huile',8],['legumes',60]]),
 M('b3','b','Thiakry : mil, lait caillé et arachides',[['mil',200],['caille',200],['sucre',15],['arachide',25]]),
 M('b4','b','Pain, pâte d’arachide, banane et lait',[['pain',120],['pate',30],['banane',120],['lait',250]]),
 M('b5','b','Yaourt grec, avoine, banane et arachides',[['grec',200],['avoine',50],['banane',120],['arachide',25]]),
 M('l1','l','Thiéboudienne maison',[['riz',300],['poisson',150],['legumes',150],['huile',15]]),
 M('l2','l','Yassa poulet et riz',[['riz',300],['poulet',170],['legumes',120],['huile',15]]),
 M('l3','l','Mafé de bœuf et riz',[['riz',300],['boeuf',150],['pate',40],['legumes',100]]),
 M('l4','l','Riz au niébé et sardines',[['riz',250],['niebe',200],['sardine',100],['huile',10],['legumes',80]]),
 M('l5','l','Pâtes au thon et légumes',[['pates',300],['thon',120],['legumes',120],['huile',10]]),
 M('l6','l','Poulet grillé, patate douce et salade',[['poulet',200],['patate',250],['legumes',150],['huile',10]]),
 M('l7','l','Lentilles, riz et œufs durs',[['lentille',250],['riz',250],['oeuf',110],['huile',8]]),
 M('s1','s','Shake lait en poudre, banane et pâte d’arachide',[['laitpoudre',40],['banane',120],['pate',25]]),
 M('s2','s','Arachides grillées et banane',[['arachide',50],['banane',150]]),
 M('s3','s','Sandwich aux œufs durs',[['pain',100],['oeuf',110],['legumes',40]]),
 M('s4','s','Yaourt grec, arachides et banane',[['grec',250],['arachide',30],['banane',100]]),
 M('s5','s','Pain au thon',[['thon',80],['pain',100],['legumes',50]]),
 M('d1','d','Poisson grillé, riz et légumes',[['poisson',200],['riz',250],['legumes',150],['huile',10]]),
 M('d2','d','Omelette 4 œufs, pain et légumes',[['oeuf',220],['pain',100],['legumes',100],['huile',8]]),
 M('d3','d','Pâtes sauce tomate et bœuf',[['pates',300],['boeuf',120],['legumes',150],['huile',8]]),
 M('d4','d','Couscous de mil, sauce poisson',[['mil',300],['poisson',150],['legumes',150],['huile',10]]),
 M('d5','d','Riz, lentilles et poulet',[['riz',250],['lentille',150],['poulet',150],['legumes',80],['huile',8]]),
 M('d6','d','Sardines, pain et salade',[['sardine',120],['pain',150],['legumes',100],['huile',5]]),
 M('b6','b','Pain, arachides et lait caillé',[['pain',150],['arachide',40],['caille',200]]),
 M('s6','s','Pain, pâte d’arachide et banane',[['pain',100],['pate',35],['banane',100]]),
 M('d7','d','Riz, niébé et œufs',[['riz',300],['niebe',200],['oeuf',110],['huile',10]])
];
const SLOTS=['b','l','s','d'];
const SHARE={b:.25,l:.35,s:.15,d:.25};
const SLOT_N={b:'Petit-déjeuner',l:'Déjeuner',s:'Collation',d:'Dîner'};
const OFF={b:0,l:2,s:4,d:6};

function targets(p){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='h'?5:-161);
  const act=[1.2,1.35,1.5][p.act]+0.03*p.days;
  const tdee=bmr*act;
  const kcal=Math.round((tdee+p.surplus)/50)*50;
  const prot=Math.round(p.w*1.8/5)*5;
  const fat=Math.round(kcal*.25/9/5)*5;
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4/5)*5);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carb};
}
function mac(items){let k=0,p=0,c=0,f=0;for(const [id,g] of items){const X=FOODS[id],r=g/100;k+=X.k*r;p+=X.p*r;c+=X.c*r;f+=X.f*r;}return {k,p,c,f};}
function avail(X,src){const L=X.price.local,A=X.price.auchan;return src==='local'?L!=null:src==='auchan'?A!=null:(L!=null||A!=null);}
function best(X,src){
  const L=X.price.local,A=X.price.auchan;
  if(src==='local')return {price:L,where:'local'};
  if(src==='auchan')return {price:A,where:'auchan'};
  if(L!=null&&A!=null)return A<=L*.8?{price:A,where:'auchan'}:{price:L,where:'local'};
  return L!=null?{price:L,where:'local'}:{price:A,where:'auchan'};
}
function cost(items,src){let t=0;for(const [id,g] of items){const X=FOODS[id];t+=g*X.raw/1000*best(X,src).price;}return t;}
function candidates(slot,src){return MEALS.filter(m=>m.slot===slot&&m.items.every(it=>avail(FOODS[it[0]],src)));}
function scaleItems(items,f){
  return items.map(([id,g])=>{
    const X=FOODS[id];let x=g*f;
    if(X.unit){x=Math.max(1,Math.round(x/X.unit.g))*X.unit.g;}
    else{const st=x>=150?10:5;x=Math.max(st,Math.round(x/st)*st);}
    return [id,x];
  });
}
function build(meal,kt,src){
  const base=mac(meal.items);
  const f=Math.min(1.8,Math.max(.5,kt/base.k));
  const items=scaleItems(meal.items,f),m=mac(items);
  return {id:meal.id,slot:meal.slot,n:meal.n,items,k:m.k,p:m.p,c:m.c,f:m.f,cost:cost(items,src)};
}
function genDay(P,di,over){
  const T=targets(P),src=P.src,pick={},cands={},locked={};
  for(const s of SLOTS){
    cands[s]=candidates(s,src);
    const o=over&&over[di+':'+s],i=cands[s].findIndex(m=>m.id===o);
    locked[s]=i>=0;
    pick[s]=i>=0?i:(di+OFF[s])%cands[s].length;
  }
  /* Essaie toutes les combinaisons de 4 repas (au plus ~1500) : garde celles qui respectent le budget,
     puis prend celle qui a le plus de protéines, le plus proche des calories visées et de la rotation du jour.
     Si aucune ne rentre dans le budget, prend la moins chère. */
  const opts={};
  for(const s of SLOTS)opts[s]=cands[s].map(m=>build(m,T.kcal*SHARE[s],src));
  const rng=s=>locked[s]?[pick[s]]:opts[s].map((_,i)=>i);
  let chosen=null,bestScore=-1e18,cheap=null,cheapCost=1e18;
  for(const i0 of rng('b'))for(const i1 of rng('l'))for(const i2 of rng('s'))for(const i3 of rng('d')){
    const ix={b:i0,l:i1,s:i2,d:i3},ms=SLOTS.map(s=>opts[s][ix[s]]);
    const c=ms.reduce((a,m)=>a+m.cost,0);
    if(c<cheapCost){cheapCost=c;cheap=ms;}
    if(c>P.budget)continue;
    const pr=ms.reduce((a,m)=>a+m.p,0),kc=ms.reduce((a,m)=>a+m.k,0);
    const dev=SLOTS.reduce((a,s)=>a+(ix[s]===pick[s]?0:1),0);
    const score=Math.min(pr,T.prot*1.1)-dev*4-Math.abs(kc-T.kcal)/20;
    if(score>bestScore){bestScore=score;chosen=ms;}
  }
  const meals=chosen||cheap,total=meals.reduce((a,m)=>a+m.cost,0);
  const sum=k=>meals.reduce((a,m)=>a+m[k],0);
  return {T,meals,k:sum('k'),p:sum('p'),c:sum('c'),f:sum('f'),cost:total};
}
/* ---------- Courses : moteur ----------
   Idées reprises des grandes apps : quantités en vrais conditionnements (Mealime), placard « j'en ai déjà » (Mealime),
   sorties planifiées pour le frais et liste qui reste en place jusqu'à la fin de la période (AnyList), ajouts libres (Bring!).
   PACK : g = poids d'un conditionnement entier (boîte, brique, baguette…), step = vente au poids par pas de x grammes.
   price = prix fixe d'un conditionnement au marché (sinon prix au kg × poids). */
const PACK={
 riz:{step:500}, pates:{g:500,n:'paquet de 500 g',pl:'paquets de 500 g'}, pain:{g:190,n:'baguette',pl:'baguettes',price:150},
 mil:{step:250}, patate:{step:500}, avoine:{g:500,n:'boîte de 500 g',pl:'boîtes de 500 g'},
 niebe:{step:250}, lentille:{g:500,n:'paquet de 500 g',pl:'paquets de 500 g'},
 oeuf:{g:55,n:'œuf',pl:'œufs'}, poulet:{step:500}, boeuf:{step:250}, poisson:{step:500},
 sardine:{g:125,n:'boîte',pl:'boîtes'}, thon:{g:160,n:'boîte',pl:'boîtes'},
 arachide:{step:250}, pate:{step:250}, lait:{g:1000,n:'brique de 1 L',pl:'briques de 1 L'},
 laitpoudre:{g:400,n:'sachet de 400 g',pl:'sachets de 400 g'}, caille:{g:500,n:'sachet de 500 g',pl:'sachets de 500 g'},
 grec:{g:500,n:'pot de 500 g',pl:'pots de 500 g'}, banane:{g:150,n:'banane',pl:'bananes'},
 legumes:{step:250}, huile:{g:1000,n:'bouteille de 1 L',pl:'bouteilles de 1 L'}, sucre:{step:500}
};
/* Durée de conservation : 2 = à racheter tous les 2 jours, 4 = tous les 4 jours, absent = stock pour toute la période. */
const FRESH={poisson:2,boeuf:2,poulet:2,legumes:4,banane:4,caille:4,grec:4};
const MEAT=['poisson','boeuf','poulet'];
const PANTRY=['huile','sucre','laitpoudre','pate','avoine','riz','pates'];
const RAYON=['Féculents','Légumineuses','Viandes, poissons, œufs','Produits laitiers','Fruits & légumes','Épicerie'];
const STORE_N={local:'Marché et boutique',auchan:'Auchan'};
const fromIso=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);};
const addDays=(s,k)=>{const d=fromIso(s);d.setDate(d.getDate()+k);return iso(d);};
const DSH=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
const nth=n=>n===1?'1er':String(n);
const shortDate=s=>{const d=fromIso(s);return DSH[wd(d)]+' '+nth(d.getDate());};
function dayName(s){
  const t=iso(new Date());
  if(s===t)return 'Aujourd’hui';
  if(s===addDays(t,1))return 'Demain';
  const d=fromIso(s);return DAYS[wd(d)]+' '+nth(d.getDate())+' '+MOIS[d.getMonth()];
}
/* Magasin : le marché d'abord ; Auchan seulement si l'article n'est pas au marché ou s'il y est au moins 20 % moins cher. */
function storeFor(X,src){
  const L=X.price.local,A=X.price.auchan;
  if(src==='local'||A==null)return 'local';
  if(src==='auchan'||L==null)return 'auchan';
  return A<=L*.8?'auchan':'local';
}
function buyOf(id,need,where){
  const X=FOODS[id],pk=PACK[id]||{step:250},kg=X.price[where];
  if(pk.g){
    const n=Math.max(1,Math.ceil(need/pk.g-.02)),bought=n*pk.g;
    let txt=n+' '+(n>1?pk.pl:pk.n);
    if(id==='oeuf'&&n>=30)txt+=` (${n%30?'environ ':''}${fr(n/30,n%30?1:0)} plateau${n>=60?'x':''})`;
    const c=pk.price&&where==='local'?n*pk.price:bought/1000*kg;
    return {txt,cost:Math.round(c/25)*25,left:bought-need};
  }
  const st=pk.step,buy=Math.max(st,Math.ceil(need/st-.02)*st);
  return {txt:buy>=1000?fr(buy/1000,buy%1000?1:0)+' kg':buy+' g',cost:Math.round(buy/1000*kg/25)*25,left:buy-need};
}
const nDaysOf=sc=>sc==='day'?1:sc==='3'?3:7;
/* La liste reste la même du premier au dernier jour de la période ; une nouvelle liste démarre ensuite d'elle-même. */
function shopAnchor(){
  const t=iso(new Date()),n=nDaysOf(S.sc);
  let sh=S.shop;
  if(!sh||sh.n!==n||sh.start>t||addDays(sh.start,n-1)<t){sh=S.shop={start:t,n};save();}
  return sh;
}
function shopPlan(P){
  const sh=shopAnchor(),n=sh.n,src=P.src,fz=!!S.freezer;
  const days=[];
  for(let k=0;k<n;k++){
    const date=addDays(sh.start,k),d=genDay(P,wd(fromIso(date)),S.over),need={},uses={};
    d.meals.forEach(m=>m.items.forEach(([id,g])=>{need[id]=(need[id]||0)+g*FOODS[id].raw;(uses[id]=uses[id]||new Set()).add(m.n);}));
    days.push({date,need,uses});
  }
  const life=id=>(fz&&MEAT.includes(id))?0:(FRESH[id]||0);
  const trips=[];
  for(let k=0;k<n;k+=2){
    const acc={};
    const add=(id,kk)=>{const a=acc[id]=acc[id]||{id,need:0,uses:new Set()};a.need+=days[kk].need[id];days[kk].uses[id].forEach(u=>a.uses.add(u));};

function spark(){
  const w=S.weights.slice(-14);
  if(w.length<2)return '';
  const vs=w.map(x=>x.kg),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const pts=w.map((x,i)=>[8+i*(284/(w.length-1)),8+(1-(x.kg-mn)/rg)*54]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const l=pts[pts.length-1];
  const ar=d+` L${l[0].toFixed(1)} 69 L${pts[0][0].toFixed(1)} 69 Z`;
  return `<svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none" role="img" aria-label="Évolution du poids"><line x1="0" y1="69" x2="300" y2="69"/><path class="ar" d="${ar}"/><path d="${d}" vector-effect="non-scaling-stroke"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="4"/></svg>`;
}
function trend(){
  const w=S.weights;
  if(w.length<2)return 'Pèse-toi le matin, à jeun, une à deux fois par semaine. Objectif : +0,25 à +0,5 kg par semaine.';
  const a=w[0],b=w[w.length-1],days=(new Date(b.d)-new Date(a.d))/864e5;
  if(days<7)return 'Continue les pesées : la tendance se lit à partir d’une semaine.';
  const r=(b.kg-a.kg)/(days/7);
  if(r<.1)return `Tendance : ${fr(r,2)} kg par semaine. La prise est trop lente : ajoute environ 150 kcal par jour (une portion d’arachides ou de lait en poudre).`;
  if(r>.6)return `Tendance : +${fr(r,2)} kg par semaine. C’est rapide : une part de cette prise sera du gras. Réduis un peu les portions de glucides.`;
  return `Tendance : +${fr(r,2)} kg par semaine. Bon rythme, continue.`;
}

  const P=S.p,pl=shopPlan(P);
  const list=which==='all'?pl.trips:[pl.trips[+which]].filter(Boolean);
  let t=`*Courses Mbër Muscu*`+(pl.n>1?` (${shortDate(pl.sh.start)} → ${shortDate(addDays(pl.sh.start,pl.n-1))})`:'')+'\n';
  let tot=0;
  list.forEach(tr=>{
    const rest=tr.items.filter(x=>!isBought(tr.date+'|'+x.id));
    if(!rest.length)return;
    t+=`\n*${dayName(tr.date)} · ${tripTitle(tr,P)}*\n`;
    let w='';
    rest.forEach(x=>{if(x.where!==w){t+=`_${STORE_N[x.where]}_\n`;w=x.where;}t+=`• ${x.name} : ${x.qty}\n`;tot+=x.cost;});
  });
  if(which==='all'){
    const br=pl.bread.filter(b=>!isBought(b.date+'|pain'));
    if(br.length){t+=`\n*Pain, chaque matin*\n`+br.map(b=>`• ${shortDate(b.date)} : ${b.qty}`).join('\n')+'\n';tot+=br.reduce((a,b)=>a+b.cost,0);}
  }
  const ex=(S.extra||[]).filter(x=>!isBought('x|'+x.id));
  if(ex.length&&(which==='all'||+which===pl.trips.findIndex(tr=>tr.date>=iso(new Date()))))t+=`\n*Ajouts*\n`+ex.map(x=>'• '+x.t).join('\n')+'\n';
  t+=`\nTotal estimé : ${money(tot)}`;
  return t;
}

/* ---------- Séances ---------- */
const lastOf=(id,date)=>{const a=S.logs[id]||[];for(let i=a.length-1;i>=0;i--)if(a[i].d<date)return a[i];return null;};
function hint(x,date){
  const L=lastOf(x.id,date);
  if(!L)return {txt:'Première fois : choisis une difficulté qui te laisse 2 répétitions en réserve.',kg:''};
  const reps=L.sets.map(s=>s.reps).join(' · '),hi=repHi(x),all=hi>0&&L.sets.every(s=>s.reps>=hi);
  if(x.kg){
    const mk=Math.max(...L.sets.map(s=>s.kg)),inc=x.low?5:2.5;
    if(all)return {txt:`Dernière fois : ${fr(mk,1)} kg, ${reps}. Tu as tout fait au maximum : passe à ${fr(mk+inc,1)} kg.`,kg:mk+inc};
    return {txt:`Dernière fois : ${fr(mk,1)} kg, ${reps}. Garde ${fr(mk,1)} kg et vise 1 répétition de plus par série.`,kg:mk};
  }
  if(all)return {txt:`Dernière fois : ${reps}. Tu es au maximum : passe à une variante plus dure (pieds surélevés, descente en 3 secondes, sac chargé).`,kg:''};
  return {txt:`Dernière fois : ${reps}. Vise 1 répétition de plus par série.`,kg:''};
}
function ensureSess(date,ses){
  const SS=S.sess[date]=S.sess[date]||{ex:{},done:false};
  ses.ex.forEach(x=>{const a=SS.ex[x.id]=SS.ex[x.id]||[];while(a.length<x.s)a.push({kg:'',reps:'',ok:false});});
  return SS;
}
function exCard(x,date,SS,open){
  const rows=SS.ex[x.id].slice(0,x.s),hn=hint(x,date),nk=x.kg?'':' nokg',an=ANIM_OF[x.id.split('-')[1]];
  return `<details class="ex"${open?' open':''}><summary><div><b>${x.n}</b><span class="muted small">${x.m}</span></div><span class="spec">${x.s}×${x.r}</span></summary><div class="exb">${an?figHTML(an):''}<p class="tip">${x.t}</p><p class="hint">${hn.txt}</p>
  <div class="shead${nk}"><span>Série</span>${x.kg?'<span>kg</span>':''}<span>${x.time?'secondes':'répétitions'}</span><span></span></div>
  ${rows.map((r,i)=>`<div class="set${r.ok?' ok':''}${nk}"><span class="sn">${i+1}</span>${x.kg?`<input type="number" inputmode="decimal" step="0.5" min="0" max="500" data-set="kg" data-ex="${x.id}" data-i="${i}" value="${r.kg}" placeholder="${hn.kg}" aria-label="Poids série ${i+1}">`:''}<input type="number" inputmode="numeric" step="1" min="0" max="999" data-set="reps" data-ex="${x.id}" data-i="${i}" value="${r.reps}" placeholder="${repLo(x)}" aria-label="${x.time?'Secondes':'Répétitions'} série ${i+1}"><button class="chk" data-act="setok" data-ex="${x.id}" data-i="${i}" data-rest="${x.rest}" aria-pressed="${r.ok}" aria-label="Valider la série ${i+1}">✓</button></div>`).join('')}
  <div class="meta">Repos conseillé : ${mmss(x.rest)}. Appuie sur ✓ pour valider avec les valeurs proposées.</div></div></details>`;
}
function viewTrain(){
  const P=S.p,di=S.day,dt=dateOfWeekday(di),date=iso(dt),ses=sessionFor(P,di);
  let o=strip(di,i=>sessionFor(P,i)?`<i class="dot${sessDone(i)?' done':''}"></i>`:'');
  o+=`<div class="eyebrow">${dateLabel(dt)}</div>`;
  if(!ses){
    return o+`<section class="card"><h2>Jour de repos</h2><p>Marche 20 à 30 minutes, étire-toi 10 minutes, dors 8 heures. Mange tes repas en entier : c’est ici que le muscle grandit.</p></section>`;
  }
  const SS=ensureSess(date,ses);
  o+=`<section class="card"><div class="eyebrow">${P.equip==='gym'?'Salle':'Maison'} · ${P.level==='deb'?'Débutant':'Intermédiaire'}</div><h2 class="big">${ses.n}</h2><p class="muted">${ses.sub} · ${ses.ex.length} exercices · environ ${ses.min} min</p><p class="small">Échauffement de 5 à 8 minutes : 3 minutes de marche rapide ou de corde à sauter, rotations d’épaules et de hanches, puis 1 série légère du premier exercice.</p></section>`;
  ses.ex.forEach((x,i)=>{o+=exCard(x,date,SS,i===0);});
  o+=`<button class="btn wide" data-act="finish">${SS.done?'Séance enregistrée. Mettre à jour':'Terminer la séance'}</button>`;
  return o;
}

/* ---------- Profil ---------- */
function targetsHTML(){
  const T=targets(S.p);
  return `<div class="eyebrow">Tes cibles par jour</div><div class="tg"><div><b>${fr(T.kcal)}</b><span>kcal</span></div><div><b>${T.prot} g</b><span>protéines</span></div><div><b>${T.carb} g</b><span>glucides</span></div><div><b>${T.fat} g</b><span>lipides</span></div></div><p class="small muted">Dépense estimée : ${fr(T.tdee)} kcal par jour (métabolisme de base ${fr(T.bmr)}). Tu manges ${fr(S.p.surplus)} kcal de plus pour prendre du muscle.</p>`;
}
function sel(k,opts){return `<select id="p-${k}" data-p="${k}">`+opts.map(o=>`<option value="${o[0]}"${String(S.p[k])===String(o[0])?' selected':''}>${o[1]}</option>`).join('')+'</select>';}
function num(k,min,max,step){return `<input id="p-${k}" data-p="${k}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" value="${S.p[k]}">`;}
function viewProfile(){
  return `<section class="card" id="targets">${targetsHTML()}</section>
  <section class="card"><div class="eyebrow">Toi</div><div class="fg">
   <div class="f"><label for="p-sex">Sexe</label>${sel('sex',[['h','Homme'],['f','Femme']])}</div>
   <div class="f"><label for="p-age">Âge</label>${num('age',16,70,1)}</div>
   <div class="f"><label for="p-h">Taille (cm)</label>${num('h',140,215,1)}</div>
   <div class="f"><label for="p-w">Poids (kg)</label>${num('w',35,160,.5)}</div>
   <div class="f full"><label for="p-act">Activité en dehors des séances</label>${sel('act',[[0,'Faible : études, assis une grande partie du jour'],[1,'Moyenne : tu marches tous les jours'],[2,'Élevée : travail physique']])}</div>
   <div class="f full"><label for="p-surplus">Vitesse de prise de masse</label>${sel('surplus',[[250,'Lente et propre (+250 kcal)'],[400,'Standard (+400 kcal)'],[600,'Rapide (+600 kcal)']])}</div>
  </div></section>
  <section class="card"><div class="eyebrow">Entraînement</div><div class="fg">
   <div class="f"><label for="p-level">Niveau</label>${sel('level',[['deb','Débutant'],['int','Intermédiaire']])}</div>
   <div class="f"><label for="p-days">Séances par semaine</label>${sel('days',[[3,'3 jours'],[4,'4 jours'],[5,'5 jours']])}</div>
   <div class="f full"><label for="p-equip">Où tu t’entraînes</label>${sel('equip',[['gym','À la salle'],['home','À la maison, sans matériel']])}</div>
  </div></section>
  <section class="card"><div class="eyebrow">Repas et budget</div><div class="fg">
   <div class="f full"><label for="p-src">Où tu fais tes courses</label>${sel('src',[['both','Marché et Auchan'],['local','Marché ou boutique du quartier'],['auchan','Auchan seulement']])}</div>
   <div class="f full"><label for="p-budget">Budget repas par jour (FCFA)</label>${num('budget',1500,15000,250)}<span class="h">Le plan choisit les repas les moins chers qui gardent assez de protéines.</span></div>
  </div></section>
  <div class="about">${LOGO(36)}<div><b>Mbër Muscu</b><span class="small muted">Prise de masse, repas sénégalais et séances guidées</span></div></div>
  <p class="small muted">Estimations générales pour un adulte en bonne santé. Si tu as un problème de santé, parles-en à un médecin avant de changer ton alimentation ou ton entraînement.</p>`;
}

/* ---------- Rendu ---------- */
const VIEWS={today:viewToday,meals:viewMeals,train:viewTrain,shop:viewShop,profile:viewProfile};
function render(anim){
  const y=window.scrollY;
  $('#hdr').innerHTML=hdr();
  app.classList.toggle('anim',!!anim);
  app.innerHTML=VIEWS[S.tab]();
  tabs();
  window.scrollTo(0,y);
}

/* ---------- Minuteur de repos ---------- */
let rt=null,rleft=0;
function showRest(){
  const r=$('#rest');r.hidden=false;
  r.innerHTML=`<span class="rt">${mmss(Math.max(0,rleft))}</span><span>Repos</span><button data-act="rest-add">+15 s</button><button data-act="rest-x" aria-label="Fermer le minuteur">Fermer</button>`;
}
function startRest(sec){
  clearInterval(rt);rleft=sec;showRest();
  rt=setInterval(()=>{
    rleft--;
    if(rleft<=0){
      clearInterval(rt);rt=null;
      $('#rest').innerHTML='<span class="rt">0:00</span><span>Repos terminé, c’est reparti.</span><button data-act="rest-x">OK</button>';
      try{if(navigator.vibrate)navigator.vibrate(250);}catch(e){}
    }else showRest();
  },1000);
}

/* ---------- Actions ---------- */
function showCopy(text){
  const b=$('#cpbox');if(!b)return;
  b.innerHTML='<p class="small muted">Copie automatique impossible ici : le texte est sélectionné, copie-le à la main.</p><textarea class="cp" id="cptxt" readonly></textarea>';
  const t=$('#cptxt');t.value=text;t.focus();t.select();
}
function finish(){
  const date=iso(dateOfWeekday(S.day)),ses=sessionFor(S.p,S.day),SS=S.sess[date];
  if(!ses||!SS)return;
  ses.ex.forEach(x=>{
    const sets=(SS.ex[x.id]||[]).filter(r=>+r.reps>0).map(r=>({kg:+r.kg||0,reps:+r.reps}));
    if(!sets.length)return;
    const a=(S.logs[x.id]||[]).filter(l=>l.d!==date);
    a.push({d:date,sets});a.sort((p,q)=>p.d<q.d?-1:1);S.logs[x.id]=a;
  });
  SS.done=true;save();render();toast('Séance enregistrée');
}
/* Mannequins : animation en boucle pour les exercices ouverts ; avec « réduire les animations », un appui alterne départ et arrivée. */
const REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let lastFrame=0;
function figLoop(ts){
  requestAnimationFrame(figLoop);
  if(ts-lastFrame<33)return;
  lastFrame=ts;
  document.querySelectorAll('details.ex[open] svg.fig').forEach(s=>{
    const p=PATS[s.dataset.a];
    s.innerHTML=figInner(s.dataset.a,.5-.5*Math.cos(2*Math.PI*ts/1000/p.dur));
  });
}
if(!REDUCE)requestAnimationFrame(figLoop);
document.addEventListener('click',e=>{
  const fg=e.target.closest('svg.fig');
  if(fg&&REDUCE){const on=fg.dataset.s==='1';fg.dataset.s=on?'0':'1';fg.innerHTML=figInner(fg.dataset.a,on?0:1);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,P=S.p;
  if(a==='tab'){S.tab=b.dataset.t;render(true);window.scrollTo(0,0);}
  else if(a==='day'){S.day=+b.dataset.i;render();}
  else if(a==='open-train'){S.tab='train';S.day=wd(new Date());render();window.scrollTo(0,0);}
  else if(a==='eat'){const k=iso(new Date());const m=S.eaten[k]=S.eaten[k]||{};m[b.dataset.slot]=!m[b.dataset.slot];save();render();}
  else if(a==='swap'){
    const s=b.dataset.slot,cur=genDay(P,S.day,S.over).meals.find(m=>m.slot===s),list=candidates(s,P.src);
    const i=list.findIndex(m=>m.id===cur.id);
    S.over[S.day+':'+s]=list[(i+1)%list.length].id;save();render();
  }
  else if(a==='reset-day'){SLOTS.forEach(s=>{delete S.over[S.day+':'+s];});save();render();}
  else if(a==='sc'){if(S.sc!==b.dataset.v){S.sc=b.dataset.v;S.shop=null;}save();render();}
  else if(a==='bought'){const k=b.dataset.k;if(S.bought[k])delete S.bought[k];else S.bought[k]=1;save();render();}
  else if(a==='have'){const id=b.dataset.id;if(S.have[id])delete S.have[id];else S.have[id]=1;save();render();}
  else if(a==='freezer'){S.freezer=!S.freezer;save();render();toast(S.freezer?'Viande et poisson ajoutés à la grande course':'Viande et poisson achetés frais');}
  else if(a==='xdel'){S.extra=(S.extra||[]).filter(x=>x.id!==b.dataset.id);delete S.bought['x|'+b.dataset.id];save();render();}
  else if(a==='copy'){
    const t=shopCopy(b.dataset.trip||'all');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>toast('Liste copiée'),()=>showCopy(t));
    }else showCopy(t);
  }
  else if(a==='wsave'){
    const v=parseFloat($('#wn').value);
    if(!isFinite(v)||v<30||v>200){toast('Entre un poids entre 30 et 200 kg');return;}
    const d=iso(new Date());
    S.weights=S.weights.filter(x=>x.d!==d);S.weights.push({d,kg:v});S.weights.sort((p,q)=>p.d<q.d?-1:1);
    S.p.w=v;save();render();toast('Poids enregistré');
  }
  else if(a==='setok'){
    const row=b.closest('.set'),ins=row.querySelectorAll('input'),id=b.dataset.ex,i=+b.dataset.i;
    const date=iso(dateOfWeekday(S.day)),r=S.sess[date].ex[id][i];
    const on=!r.ok;
    if(on)ins.forEach(inp=>{if(inp.value===''&&inp.placeholder!==''){inp.value=inp.placeholder;r[inp.dataset.set]=inp.value;}});
    r.ok=on;row.classList.toggle('ok',on);b.setAttribute('aria-pressed',on);
    save();
    if(on)startRest(+b.dataset.rest);
  }
  else if(a==='finish')finish();
  else if(a==='rest-add'){rleft+=15;showRest();}
  else if(a==='rest-x'){clearInterval(rt);rt=null;$('#rest').hidden=true;}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(f.dataset.form!=='xadd')return;
  e.preventDefault();
  const inp=$('#xin'),v=(inp.value||'').trim();if(!v)return;
  S.extra=(S.extra||[]).concat({id:Date.now().toString(36),t:v.slice(0,60)});save();render();
  const n=$('#xin');if(n)n.focus();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.p){
    const k=t.dataset.p;let v=t.value;
    if(t.type==='number'){v=parseFloat(v);if(!isFinite(v))return;v=Math.min(+t.max,Math.max(+t.min,v));}
    else if(/^\d+$/.test(v))v=+v;
    S.p[k]=v;S.p.sample=false;
    $('#targets').innerHTML=targetsHTML();save();
  }else if(t.dataset.set){
    const date=iso(dateOfWeekday(S.day)),r=S.sess[date]&&S.sess[date].ex[t.dataset.ex]&&S.sess[date].ex[t.dataset.ex][+t.dataset.i];
    if(!r)return;
    r[t.dataset.set]=t.value;save();
  }
});

render(true);
initCloud();
</script>

</body>
